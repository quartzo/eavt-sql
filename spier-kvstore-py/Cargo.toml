[package]
name = "spier-kvstore-py"
version = "0.1.0"
edition = "2021"
description = "PyO3 bindings for spier-kvstore (raw KVStoreEngine, no EAVT)"

[lib]
name = "spier_kvstore_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
spier-journal-file = { path = "../spier-journal-file" }
spier-kvstore = { path = "../spier-kvstore" }
spier-storage-traits = { path = "../spier-storage-traits" }
