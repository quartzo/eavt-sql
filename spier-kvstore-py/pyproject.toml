[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "spier-kvstore-py"
version = "0.1.0"
description = "PyO3 bindings for spier-kvstore (raw KVStoreEngine, no EAVT)"
requires-python = ">=3.13"

[tool.maturin]
module-name = "spier_kvstore_py"
manifest-path = "Cargo.toml"
