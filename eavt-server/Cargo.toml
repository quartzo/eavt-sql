[package]
name = "eavt-server"
version = "0.1.0"
edition = "2021"

[dependencies]
spier-eavt-query = { path = "../spier-eavt-query" }
spier-storage-traits = { path = "../spier-storage-traits" }
spier-value = { path = "../spier-value" }
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
tonic-build = "0.13"
