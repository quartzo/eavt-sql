[project]
name = "eavt"
version = "0.1.0"
description = "EAVT database engine — Python port with RocksDB storage"
requires-python = ">=3.13"
dependencies = [
    "rocksdict>=0.3",
    "sortedcontainers>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eavt"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
