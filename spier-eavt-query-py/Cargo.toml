[package]
name = "spier-eavt-query-py"
version = "0.1.0"
edition = "2021"
description = "PyO3 bindings for spier-eavt-query"

[lib]
name = "spier_eavt_query_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
spier-eavt-query = { path = "../spier-eavt-query" }
spier-page-store-nim = { path = "../spier-page-store-nim" }
spier-query-ir = { path = "../spier-query-ir" }
spier-transactor = { path = "../spier-transactor" }
spier-value = { path = "../spier-value" }
