[project]
name = "eavt-sql"
version = "0.1.0"
description = "EAVT database engine (Nim backend)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Fabio Ferrari", email = "fabio@ferraribr.com" }]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "msgpack>=1.0",
    "numpy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["py_eavt_client/src/eavt_client"]
