[package]
name = "spier-kvstore"
version = "0.1.0"
edition = "2021"
description = "Pure key-only multi-CF KV store (MemTable + PageStore + flush + tx_delta)"

[lib]
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
lru = "0.12"
dynspire-commons = { path = "../dynspire-commons" }
spier-blobstore-memory = { path = "../spier-blobstore-memory" }
spier-blobstore-file = { path = "../spier-blobstore-file" }
spier-blobstore-s3 = { path = "../spier-blobstore-s3" }
spier-journal-file = { path = "../spier-journal-file" }
spier-memtable = { path = "../spier-memtable" }

[dev-dependencies]
tempfile = "3"
