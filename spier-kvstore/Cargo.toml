[package]
name = "spier-kvstore"
version = "0.1.0"
edition = "2021"
description = "Pure key-only multi-CF KV store (MemTable + PageStore + flush + tx_delta)"

[lib]
crate-type = ["rlib"]

[dependencies]
spier-storage-traits = { path = "../spier-storage-traits" }
spier-page-store-nim = { path = "../spier-page-store-nim" }
spier-memtable = { path = "../spier-memtable" }

[dev-dependencies]
tempfile = "3"
